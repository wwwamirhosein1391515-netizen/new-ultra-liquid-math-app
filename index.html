<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیشه مایع - ماشین حساب شفاف</title>
    <!-- لود کردن Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Tahoma', 'sans-serif'],
                    },
                    colors: {
                        'primary-light': '#8B5CF6', 
                        'accent-cyan': '#06B6D4',   
                        'dark-text': '#1F2937',     
                    },
                }
            }
        }
    </script>
    <style>
        /* پس‌زمینه زنده و رنگارنگ‌تر برای دیده شدن بهتر شیشه */
        body {
            background: linear-gradient(125deg, #a1c4fd, #c2e9fb, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradient-shift 10s ease infinite;
            min-height: 100vh;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* استایل شیشه جدید (Ultra Transparent) 
           بسیار شفاف‌تر با بلور (Blur) بالا
        */
        .glass-effect {
            background: rgba(255, 255, 255, 0.15); /* شفافیت بسیار زیاد */
            backdrop-filter: blur(40px); /* تاری شدید پس‌زمینه */
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.3); /* حاشیه نازک و براق */
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); /* سایه نرم */
            border-radius: 2.5rem;
            color: #1F2937;
        }

        /* کادرهای مایع داخلی (Liquid Pills)
           برای بخش‌بندی داخل برنامه
        */
        .liquid-pill {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2); /* درخشش داخلی */
            border-radius: 2rem; /* کاملا گرد */
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .liquid-pill:hover {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        /* دکمه‌ها */
        .calc-button {
            @apply h-16 w-full rounded-2xl text-xl font-extrabold transition-all active:scale-95 flex items-center justify-center shadow-lg;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }
        .num-button {
            @apply bg-white/30 text-dark-text hover:bg-white/50;
        }
        .op-button {
            @apply bg-accent-cyan/20 text-accent-cyan hover:bg-accent-cyan/40;
        }
        .action-button {
            @apply bg-pink-300/40 text-pink-800 hover:bg-pink-300/60;
        }
        .equal-button {
            @apply bg-primary-light/80 text-white hover:bg-primary-light shadow-primary-light/30;
        }

        /* اینپوت‌ها شفاف‌تر شدند */
        #calc-display {
            @apply rounded-2xl p-4 text-right text-4xl font-mono text-dark-text bg-white/20 shadow-inner border border-white/30 backdrop-blur-md;
        }
        .input-style {
            @apply w-full text-center text-2xl font-bold text-dark-text bg-white/30 border-b-2 border-primary-light/30 focus:border-primary-light outline-none py-2 placeholder-gray-500/70 rounded-xl px-3 transition-colors;
        }
        
        /* تب‌ها */
        .tab-btn {
            @apply flex-1 py-2 text-xs md:text-sm font-bold rounded-xl transition-all mx-0.5 backdrop-blur-sm;
        }
        .tab-active {
            @apply bg-primary-light/90 text-white shadow-lg border border-white/20;
        }
        .tab-inactive {
            @apply text-gray-700 hover:bg-white/30;
        }
        .fraction-line {
            @apply border-b-2 border-gray-500 w-full my-1;
        }
    </style>
</head>

<body class="text-dark-text overflow-x-hidden">

    <!-- هدر بسیار شفاف -->
    <header class="p-4 glass-effect sticky top-4 mx-4 z-20 shadow-sm mt-4 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-2">
            <h1 class="text-xl font-bold tracking-wider text-primary-light drop-shadow-sm">Beauty Calc</h1>
            <span class="text-xs font-mono text-gray-600 bg-white/30 px-2 py-1 rounded-full">Liquid OS</span>
        </div>
    </header>

    <!-- کانتینر اصلی -->
    <main class="max-w-7xl mx-auto p-4 md:p-8 flex justify-center items-start pt-8 pb-20">
        
        <!-- بدنه اصلی ماشین حساب: شیشه بسیار شفاف -->
        <div id="math-app-container" class="glass-effect w-full max-w-sm p-6 md:p-8 relative overflow-hidden">
            
            <!-- افکت نور پس‌زمینه داخل شیشه -->
            <div class="absolute -top-20 -left-20 w-40 h-40 bg-purple-400/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-cyan-400/20 rounded-full blur-3xl pointer-events-none"></div>

            <h2 class="text-2xl font-extrabold text-center mb-6 drop-shadow-sm opacity-90">ابزارهای شفاف</h2>
            
            <!-- ناوبری تب‌ها -->
            <div class="flex bg-white/20 p-1.5 rounded-2xl mb-8 shadow-inner overflow-x-auto border border-white/30">
                <button onclick="changeTab('basic')" id="tab-basic" class="tab-btn tab-active">پایه</button>
                <button onclick="changeTab('fraction')" id="tab-fraction" class="tab-btn tab-inactive">کسر</button>
                <button onclick="changeTab('root')" id="tab-root" class="tab-btn tab-inactive">توان</button>
                <button onclick="changeTab('equation')" id="tab-equation" class="tab-btn tab-inactive">معادلات</button>
            </div>

            <div id="app-content" class="relative z-10">
                <!-- محتوا -->
            </div>

        </div>
    </main>

    <footer class="fixed bottom-4 w-full text-center text-gray-600 text-xs pointer-events-none">
        <span class="bg-white/30 px-3 py-1 rounded-full backdrop-blur-md">Design by Liquid Glass UI</span>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            changeTab('basic');
        });

        // --- مدیریت تب‌ها ---
        function changeTab(tabName) {
            ['basic', 'fraction', 'root', 'equation'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                if (btn) {
                    btn.classList.remove('tab-active', 'tab-inactive');
                    if (tab === tabName) {
                        btn.classList.add('tab-active');
                    } else {
                        btn.classList.add('tab-inactive');
                    }
                }
            });

            const contentDiv = document.getElementById('app-content');
            contentDiv.innerHTML = '';

            if (tabName === 'basic') {
                displayValue = '0';
                prevValue = null;
                operator = null;
                waitingForNewValue = true;
                renderBasicCalculator(contentDiv);
            } else if (tabName === 'fraction') {
                renderFractionCalculator(contentDiv);
            } else if (tabName === 'root') {
                renderRootPowerCalculator(contentDiv);
            } else if (tabName === 'equation') {
                renderEquationSolver(contentDiv);
            }
        }

        // --- توابع کمکی ---
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        // --- ۱. ماشین حساب پایه ---
        let displayValue = '0';
        let prevValue = null;
        let operator = null;
        let waitingForNewValue = true;

        function updateDisplay() {
            const display = document.getElementById('calc-display');
            if (display) {
                let formattedValue = displayValue.length > 12 ? parseFloat(displayValue).toPrecision(8) : displayValue;
                display.innerText = formattedValue;
            }
        }

        function handleDigit(digit) {
            if (waitingForNewValue) {
                displayValue = String(digit);
                waitingForNewValue = false;
            } else if (displayValue === '0') {
                displayValue = String(digit);
            } else {
                displayValue += digit;
            }
            updateDisplay();
        }

        function handleDecimal() {
            if (waitingForNewValue) {
                displayValue = '0.';
                waitingForNewValue = false;
            } else if (!displayValue.includes('.')) {
                displayValue += '.';
            }
            updateDisplay();
        }

        function handleOperator(nextOperator) {
            const inputValue = parseFloat(displayValue);
            if (prevValue === null) {
                prevValue = inputValue;
            } else if (operator) {
                const result = calculate(prevValue, inputValue, operator);
                displayValue = String(result);
                prevValue = result;
            }
            operator = nextOperator;
            waitingForNewValue = true;
            updateDisplay();
        }

        function handleEqual() {
            if (operator && prevValue !== null) {
                const inputValue = parseFloat(displayValue);
                const result = calculate(prevValue, inputValue, operator);
                displayValue = String(result);
                prevValue = null;
                operator = null;
                waitingForNewValue = true;
            }
            updateDisplay();
        }

        function handleClear() {
            displayValue = '0';
            prevValue = null;
            operator = null;
            waitingForNewValue = true;
            updateDisplay();
        }

        function calculate(num1, num2, op) {
            switch(op) {
                case '+': return num1 + num2;
                case '-': return num1 - num2;
                case '*': return num1 * num2;
                case '/': return num2 !== 0 ? num1 / num2 : 'خطا';
                default: return num2;
            }
        }

        function renderBasicCalculator(container) {
            container.innerHTML = `
                <div class="h-full flex flex-col justify-end gap-4">
                    <div id="calc-display">
                        ${displayValue}
                    </div>
                    
                    <div class="grid grid-cols-4 gap-3">
                        <button onclick="handleClear()" class="action-button calc-button">AC</button>
                        <button onclick="handleOperator('/')" class="op-button calc-button">÷</button>
                        <button onclick="handleOperator('*')" class="op-button calc-button">×</button>
                        <button onclick="handleOperator('-')" class="op-button calc-button">-</button>

                        <button onclick="handleDigit(7)" class="num-button calc-button">7</button>
                        <button onclick="handleDigit(8)" class="num-button calc-button">8</button>
                        <button onclick="handleDigit(9)" class="num-button calc-button">9</button>
                        <button onclick="handleOperator('+')" class="op-button calc-button">+</button>

                        <button onclick="handleDigit(4)" class="num-button calc-button">4</button>
                        <button onclick="handleDigit(5)" class="num-button calc-button">5</button>
                        <button onclick="handleDigit(6)" class="num-button calc-button">6</button>
                        <button onclick="handleEqual()" class="equal-button calc-button row-span-2">=</button>

                        <button onclick="handleDigit(1)" class="num-button calc-button">1</button>
                        <button onclick="handleDigit(2)" class="num-button calc-button">2</button>
                        <button onclick="handleDigit(3)" class="num-button calc-button">3</button>

                        <button onclick="handleDigit(0)" class="num-button calc-button col-span-2">0</button>
                        <button onclick="handleDecimal()" class="num-button calc-button">.</button>
                    </div>
                </div>
            `;
            updateDisplay();
        }

        // --- ۲. ماشین حساب کسرها ---
        function calculateFraction() {
            const n1 = parseFloat(document.getElementById('f1-n').value);
            const d1 = parseFloat(document.getElementById('f1-d').value);
            const n2 = parseFloat(document.getElementById('f2-n').value);
            const d2 = parseFloat(document.getElementById('f2-d').value);
            const op = document.getElementById('frac-op').value;
            const resultDiv = document.getElementById('frac-result');

            if ([n1, d1, n2, d2].some(isNaN)) {
                resultDiv.innerHTML = '<span class="text-red-500 text-sm">لطفاً همه اعداد را وارد کنید</span>';
                return;
            }
            if (d1 === 0 || d2 === 0) {
                resultDiv.innerHTML = '<span class="text-red-500 text-sm">مخرج نمی‌تواند صفر باشد</span>';
                return;
            }

            let resN, resD;

            switch(op) {
                case '+': resN = (n1 * d2) + (n2 * d1); resD = d1 * d2; break;
                case '-': resN = (n1 * d2) - (n2 * d1); resD = d1 * d2; break;
                case '*': resN = n1 * n2; resD = d1 * d2; break;
                case '/': 
                    if (n2 === 0) { resultDiv.innerHTML = 'خطا'; return; }
                    resN = n1 * d2; resD = d1 * n2; 
                    break;
            }

            const common = gcd(Math.abs(resN), Math.abs(resD));
            const simpleN = resN / common;
            const simpleD = resD / common;

            if (simpleD === 1) {
                resultDiv.innerHTML = `<span class="text-3xl font-bold text-primary-light">${simpleN}</span>`;
            } else if (simpleN === 0) {
                resultDiv.innerHTML = `<span class="text-3xl font-bold text-primary-light">0</span>`;
            } else {
                 const finalN = (simpleD < 0) ? -simpleN : simpleN;
                 const finalD = Math.abs(simpleD);
                 
                resultDiv.innerHTML = `
                    <div class="flex flex-col items-center animate-pulse">
                        <span class="text-xl font-bold">${finalN}</span>
                        <div class="w-12 h-0.5 bg-dark-text my-1"></div>
                        <span class="text-xl font-bold">${finalD}</span>
                    </div>
                `;
            }
        }

        function renderFractionCalculator(container) {
            container.innerHTML = `
                <div class="flex flex-col gap-6 items-center">
                    
                    <!-- Liquid Pill Container for Inputs -->
                    <div class="liquid-pill w-full">
                        <div class="flex items-center justify-center gap-2 w-full" dir="ltr">
                            <div class="flex flex-col items-center w-1/3">
                                <input type="number" id="f1-n" class="input-style text-sm h-10" placeholder="a">
                                <div class="fraction-line"></div>
                                <input type="number" id="f1-d" class="input-style text-sm h-10" placeholder="b">
                            </div>

                            <div class="w-1/4 px-1">
                                 <select id="frac-op" class="w-full bg-white/40 rounded-lg p-2 text-center text-lg font-bold text-primary-light outline-none cursor-pointer border border-white/30">
                                    <option value="+">+</option>
                                    <option value="-">-</option>
                                    <option value="*">×</option>
                                    <option value="/">÷</option>
                                </select>
                            </div>

                            <div class="flex flex-col items-center w-1/3">
                                <input type="number" id="f2-n" class="input-style text-sm h-10" placeholder="c">
                                <div class="fraction-line"></div>
                                <input type="number" id="f2-d" class="input-style text-sm h-10" placeholder="d">
                            </div>
                        </div>
                    </div>

                    <button onclick="calculateFraction()" class="equal-button calc-button w-full shadow-lg hover:shadow-xl transition-all">
                        محاسبه
                    </button>

                    <div class="liquid-pill w-full min-h-[100px] flex flex-col items-center justify-center">
                        <span class="text-gray-500 text-xs mb-2 uppercase tracking-widest">Result</span>
                        <div id="frac-result" class="flex items-center justify-center text-dark-text">
                            ...
                        </div>
                    </div>
                </div>
            `;
        }

        // --- ۳. رادیکال و توان ---
        function calculateRootAndPower() {
            const inputVal = document.getElementById('rp-input').value;
            const resultDiv = document.getElementById('rp-result');
            const val = parseFloat(inputVal);
            
            if (isNaN(val)) {
                resultDiv.innerHTML = '<span class="text-red-600 font-normal">عدد وارد کنید</span>';
                return;
            }

            let resultText = '';
            if (val < 0) {
                resultText += '<span class="block text-red-600 mb-2">√: ناممکن</span>';
            } else {
                resultText += `<span class="block mb-2 font-mono">√${val} = ${Math.sqrt(val).toFixed(5)}</span>`;
            }
            resultText += `<span class="block font-mono">${val}² = ${(val * val).toFixed(5)}</span>`;
            resultDiv.innerHTML = resultText;
        }

        function renderRootPowerCalculator(container) {
            container.innerHTML = `
                <div class="flex flex-col gap-6">
                    <!-- Liquid Pill Wrapper -->
                    <div class="liquid-pill text-center">
                        <label class="block text-gray-700 mb-3 text-sm font-bold">عدد ورودی</label>
                        <input type="number" id="rp-input" class="input-style" placeholder="0.0" />
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="calculateRootAndPower()" class="flex flex-col items-center justify-center gap-1 calc-button bg-primary-light/30 text-primary-light">
                            <span class="text-2xl font-serif font-bold">Run</span>
                        </button>
                        <button onclick="document.getElementById('rp-input').value = ''" class="flex flex-col items-center justify-center gap-1 calc-button bg-gray-100/40 text-gray-700">
                            <span class="text-2xl font-serif font-bold">C</span>
                        </button>
                    </div>

                    <div id="rp-result" class="liquid-pill text-center text-lg font-bold min-h-[100px] flex flex-col justify-center items-center text-gray-800">
                        ...
                    </div>
                </div>
            `;
        }

        // --- ۴. معادلات ---
        function renderEquationSolver(container) {
            container.innerHTML = `
                <div class="flex flex-col gap-4">
                    <div class="flex bg-white/20 p-1 rounded-xl mb-2 shadow-inner border border-white/30">
                        <button onclick="showEquationMode('linear')" id="mode-linear" class="flex-1 py-1.5 text-[10px] md:text-xs font-bold rounded-xl transition-all shadow">1 مجهول</button>
                        <button onclick="showEquationMode('system')" id="mode-system" class="flex-1 py-1.5 text-[10px] md:text-xs font-bold rounded-xl transition-all">2 مجهول</button>
                        <button onclick="showEquationMode('fractional')" id="mode-fractional" class="flex-1 py-1.5 text-[10px] md:text-xs font-bold rounded-xl transition-all">کسری</button>
                    </div>
                    
                    <div id="equation-content"></div>
                </div>
            `;
            showEquationMode('linear');
        }

        function showEquationMode(mode) {
            const contentDiv = document.getElementById('equation-content');
            ['linear', 'system', 'fractional'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (btn) {
                    btn.classList.remove('bg-primary-light', 'text-white', 'text-gray-600', 'hover:bg-white/30');
                    if (m === mode) {
                        btn.classList.add('bg-primary-light', 'text-white');
                    } else {
                        btn.classList.add('text-gray-600', 'hover:bg-white/30');
                    }
                }
            });

            if (mode === 'linear') {
                contentDiv.innerHTML = `
                    <div class="liquid-pill text-center">
                        <h3 class="text-gray-500 mb-4 font-mono text-base" dir="ltr">ax + b = c</h3>
                        <div class="flex items-center justify-center gap-2 text-dark-text" dir="ltr">
                            <input type="number" id="lin-a" class="w-1/4 h-10 rounded-lg text-center font-bold input-style text-lg" placeholder="a" />
                            <span class="italic text-lg text-gray-600">x</span>
                            <span class="text-gray-500">+</span>
                            <input type="number" id="lin-b" class="w-1/4 h-10 rounded-lg text-center font-bold input-style text-lg" placeholder="b" />
                            <span class="text-gray-500">=</span>
                            <input type="number" id="lin-c" class="w-1/4 h-10 rounded-lg text-center font-bold input-style text-lg" placeholder="c" />
                        </div>
                        <button onclick="solveLinear()" class="w-full mt-6 equal-button calc-button py-2 !h-12 !text-lg">محاسبه</button>
                        <div id="lin-result" class="mt-4 font-bold text-lg text-dark-text min-h-[30px]"></div>
                    </div>
                `;
            } else if (mode === 'system') {
                contentDiv.innerHTML = `
                    <div class="liquid-pill text-center">
                        <h3 class="text-gray-500 mb-4 font-mono text-sm" dir="ltr">ax+by=c | dx+ey=f</h3>
                        <div class="flex flex-col gap-3 text-dark-text">
                            <div class="flex items-center gap-2" dir="ltr">
                                <input type="number" id="sys-a" class="w-1/5 h-9 rounded-lg text-center font-bold input-style text-sm" placeholder="a" />
                                <span class="italic text-gray-500">x+</span>
                                <input type="number" id="sys-b" class="w-1/5 h-9 rounded-lg text-center font-bold input-style text-sm" placeholder="b" />
                                <span class="italic text-gray-500">y=</span>
                                <input type="number" id="sys-c" class="w-1/5 h-9 rounded-lg text-center font-bold input-style text-sm" placeholder="c" />
                            </div>
                            <div class="flex items-center gap-2" dir="ltr">
                                <input type="number" id="sys-d" class="w-1/5 h-9 rounded-lg text-center font-bold input-style text-sm" placeholder="d" />
                                <span class="italic text-gray-500">x+</span>
                                <input type="number" id="sys-e" class="w-1/5 h-9 rounded-lg text-center font-bold input-style text-sm" placeholder="e" />
                                <span class="italic text-gray-500">y=</span>
                                <input type="number" id="sys-f" class="w-1/5 h-9 rounded-lg text-center font-bold input-style text-sm" placeholder="f" />
                            </div>
                        </div>
                        <button onclick="solveSystem()" class="w-full mt-6 equal-button calc-button py-2 !h-12 !text-lg">محاسبه</button>
                        <div id="sys-result" class="mt-4 font-bold text-lg text-dark-text min-h-[30px]"></div>
                    </div>
                `;
            } else if (mode === 'fractional') {
                 contentDiv.innerHTML = `
                    <div class="liquid-pill text-center">
                        <div class="flex items-center justify-center mb-4" dir="ltr">
                            <div class="flex flex-col items-center">
                                <div class="flex items-center gap-1">
                                    <input id="fe-a" class="w-8 h-8 rounded text-center input-style text-sm p-0" placeholder="a">
                                    <span>x +</span>
                                    <input id="fe-b" class="w-8 h-8 rounded text-center input-style text-sm p-0" placeholder="b">
                                </div>
                                <div class="w-full h-0.5 bg-gray-500 my-1"></div>
                                <input id="fe-c" class="w-10 h-8 rounded text-center input-style text-sm p-0" placeholder="c">
                            </div>
                            <span class="mx-2 text-xl">=</span>
                            <div class="flex flex-col items-center">
                                <div class="flex items-center gap-1">
                                    <input id="fe-d" class="w-8 h-8 rounded text-center input-style text-sm p-0" placeholder="d">
                                    <span>x +</span>
                                    <input id="fe-e" class="w-8 h-8 rounded text-center input-style text-sm p-0" placeholder="e">
                                </div>
                                <div class="w-full h-0.5 bg-gray-500 my-1"></div>
                                <input id="fe-f" class="w-10 h-8 rounded text-center input-style text-sm p-0" placeholder="f">
                            </div>
                        </div>
                        <button onclick="solveFractionalEquation()" class="w-full mt-2 equal-button calc-button py-2 !h-12 !text-lg">حل (طرفین وسطین)</button>
                        <div id="fe-result" class="mt-4 font-bold text-lg text-dark-text min-h-[30px]"></div>
                    </div>
                `;
            }
        }

        // --- توابع محاسباتی معادلات ---
        function getInputVal(id) {
            const el = document.getElementById(id);
            return el && el.value !== '' ? parseFloat(el.value) : NaN;
        }
        function getInputValZero(id) {
            const el = document.getElementById(id);
            if (!el || el.value === '') return 0;
            return parseFloat(el.value);
        }

        function solveLinear() {
            const a = getInputVal('lin-a'), b = getInputVal('lin-b'), c = getInputVal('lin-c');
            const resultDiv = document.getElementById('lin-result');
            if (isNaN(a) || isNaN(b) || isNaN(c)) {
                resultDiv.innerHTML = '<span class="text-red-500 text-sm">ورودی ناقص</span>'; return;
            }
            if (a === 0) {
                resultDiv.innerText = (b === c) ? 'بی‌نهایت' : 'ناممکن';
            } else {
                resultDiv.className = 'mt-4 font-bold text-lg text-green-700';
                resultDiv.innerText = `x = ${((c - b) / a).toFixed(4)}`;
            }
        }

        function solveSystem() {
            const a = getInputVal('sys-a'), b = getInputVal('sys-b'), c = getInputVal('sys-c');
            const d = getInputVal('sys-d'), e = getInputVal('sys-e'), f = getInputVal('sys-f');
            const resultDiv = document.getElementById('sys-result');
            if ([a, b, c, d, e, f].some(isNaN)) {
                resultDiv.innerHTML = '<span class="text-red-500 text-sm">ورودی ناقص</span>'; return;
            }
            const det = (a * e) - (b * d);
            if (det === 0) {
                resultDiv.innerHTML = '<span class="text-red-500">بدون جواب یکتا</span>';
            } else {
                const x = ((c * e) - (b * f)) / det;
                const y = ((a * f) - (c * d)) / det;
                resultDiv.className = 'mt-4 font-bold text-base text-green-700';
                resultDiv.innerHTML = `<span dir="ltr">x=${x.toFixed(2)}, y=${y.toFixed(2)}</span>`;
            }
        }

        function solveFractionalEquation() {
            const a = getInputValZero('fe-a'), b = getInputValZero('fe-b'), c = getInputVal('fe-c');
            const d = getInputValZero('fe-d'), e = getInputValZero('fe-e'), f = getInputVal('fe-f');
            const resultDiv = document.getElementById('fe-result');

            if (isNaN(c) || isNaN(f)) { resultDiv.innerText = 'مخرج الزامی'; return; }
            if (c === 0 || f === 0) { resultDiv.innerText = 'مخرج صفر!'; return; }

            const coeffX = (f * a) - (c * d);
            const constant = (c * e) - (f * b);

            if (coeffX === 0) {
                resultDiv.innerText = (constant === 0) ? 'بی‌نهایت' : 'ناممکن';
            } else {
                resultDiv.className = 'mt-4 font-bold text-lg text-green-700';
                resultDiv.innerHTML = `<span dir="ltr">x = ${(constant / coeffX).toFixed(4)}</span>`;
            }
        }
    </script>
</body>
</html>
